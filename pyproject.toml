[project]
name = "mf"
version = "0.1.0"
description = "Leak-free LLM forecaster (Halawi 2024 + AIA Forecaster) evaluated against Kalshi and Polymarket"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic==1.11.0",
    "exa-py==2.25.0",
    "httpx==0.28.1",
    "tenacity==9.1.4",
    "pydantic==2.13.5",
    "python-dotenv==1.2.4",
    "typer==0.27.3",
    "jinja2==3.1.6",
    "numpy==2.5.3",
    "pandas==3.0.6",
    "scipy==1.18.1",
    "scikit-learn==1.9.1",
    "matplotlib==3.11.2",
    "pyyaml>=6.0",
]

[project.scripts]
mf = "mf.cli:app"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "respx==0.23.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
